name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Pull requests opened by GitHub Actions (the release workflow's "Version Packages" pull
  # request) do not trigger workflows: run CI on their branch from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check layout schema copies are in sync
        run: node schemas/sync-schema.mjs --check

      - name: Lint
        run: pnpm lint

      # Packages type-check and test against each other's built output (dist/, lib/).
      # Also builds the editor (apps/editor) and the docs site (apps/docs), which copies the editor
      # into build/editor/: the same Pages artifact deploy-docs.yml publishes, used by the e2e below;
      # and the docs-compat fixture site, twice (with and without relvista).
      - name: Build
        run: pnpm build

      # pnpm pack of each published package, then publint --strict and arethetypeswrong
      # (--profile esm-only) on the tarball, plus relvista's own rules (README, LICENSE, no tests,
      # no source maps, metadata, bounded peer ranges); see CONTRIBUTING.md "Packaging". Nothing is
      # published (that is release.yml).
      - name: Package checks (publint, arethetypeswrong)
        run: pnpm packages:check

      # The build records every npm package it bundles; the committed notices must list exactly
      # those (regenerate with `pnpm build && pnpm notices`).
      - name: Check third-party notices are up to date
        run: pnpm notices:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate examples
        run: pnpm validate:examples

      # Docs and editor pin the same @playwright/test, so one browser install serves both.
      - name: Install Playwright Chromium
        run: pnpm --filter relvista-docs exec playwright install --with-deps chromium

      - name: Phase-1 gate (docs site renders every example)
        run: pnpm test:e2e:docs

      - name: Phase-2 gate (editor, incl. byte-exact round trip of every example)
        run: pnpm test:e2e:editor

      # apps/docs-compat (built by `pnpm build`, never deployed): relvista next to mermaid, live
      # code blocks and a site's own CodeBlock wrapper, on a customised Infima theme.
      - name: Docusaurus coexistence gate (docs-compat)
        run: pnpm test:e2e:compat

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            apps/docs/test-results/
            apps/editor/test-results/
            apps/docs-compat/build/test-results/
          retention-days: 7

  # The same packages and sites on Windows: paths with drive letters and '\', CRLF from the
  # clipboard, .cmd shims instead of executables, a checkout with core.autocrlf=true (LF comes from
  # .gitattributes). Lint and typecheck do not depend on the OS and run on Linux only.
  windows:
    name: Windows (build, test, package checks, e2e)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Also proves the checkout has LF line ends.
      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Package checks (publint, arethetypeswrong)
        run: pnpm packages:check

      - name: Check third-party notices are up to date
        run: pnpm notices:check

      - name: Test
        run: pnpm test

      - name: Validate examples
        run: pnpm validate:examples

      - name: Install Playwright Chromium
        run: pnpm --filter relvista-docs exec playwright install chromium

      - name: Phase-1 gate (docs site renders every example)
        run: pnpm test:e2e:docs

      - name: Phase-2 gate (editor, incl. byte-exact round trip of every example)
        run: pnpm test:e2e:editor

      - name: Docusaurus coexistence gate (docs-compat)
        run: pnpm test:e2e:compat

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-windows
          path: |
            apps/docs/test-results/
            apps/editor/test-results/
            apps/docs-compat/build/test-results/
          retention-days: 7
